name: Promote stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published version to promote from next to latest
        type: string
        required: true
      expected_sha256:
        description: SHA-256 of the exact registry archive admitted by the promotion gate
        type: string
        required: true

permissions:
  contents: read

jobs:
  promote:
    if: github.repository == 'psiQAQ/planweft' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - name: Verify npm promotion credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm whoami --registry=https://registry.npmjs.org/ >/dev/null
      - name: Verify registry candidate and promotion evidence
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_NPM_SHA256: ${{ inputs.expected_sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            0.6.0)
              PRIOR_VERSION='0.5.1'
              POLICY='release/support-policy-0.6.0.json'
              EVIDENCE='release/evidence/0.6.0/promotion.json'
              GATE='scripts/check-state-release-gate.py'
              ;;
            0.7.0)
              PRIOR_VERSION='0.6.0'
              POLICY='release/support-policy-0.7.0.json'
              EVIDENCE='release/evidence/0.7.0/promotion.json'
              GATE='scripts/check-state-p1-release-gate.py'
              ;;
            *)
              echo "Unsupported stable promotion version: $VERSION" >&2
              exit 1
              ;;
          esac
          [[ "$EXPECTED_NPM_SHA256" =~ ^[0-9a-f]{64}$ ]]
          workdir="$RUNNER_TEMP/planweft-promotion-$VERSION"
          mkdir -p "$workdir"
          metadata="$workdir/metadata.json"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://registry.npmjs.org/planweft?promotion_run=${GITHUB_RUN_ID}" -o "$metadata"
          python3 - "$metadata" "$VERSION" "$PRIOR_VERSION" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          version, prior = sys.argv[2:]
          assert version in data['versions']
          assert data['dist-tags']['latest'] == prior, data['dist-tags']
          assert data['dist-tags']['next'] == version, data['dist-tags']
          assert data['versions'][version]['dist']['integrity']
          print({'latest': data['dist-tags']['latest'], 'next': data['dist-tags']['next']})
          PY
          archive="$workdir/planweft-$VERSION.tgz"
          curl --fail --silent --show-error "https://registry.npmjs.org/planweft/-/planweft-$VERSION.tgz?promotion_run=${GITHUB_RUN_ID}" -o "$archive"
          actual_sha256=$(sha256sum "$archive" | awk '{print $1}')
          test "$actual_sha256" = "$EXPECTED_NPM_SHA256"
          python3 "$GATE" \
            --promotion \
            --policy "$POLICY" \
            --evidence "$EVIDENCE" \
            --archive "$archive"
      - name: Promote candidate to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: npm dist-tag add "planweft@$VERSION" latest --registry=https://registry.npmjs.org
      - name: Verify stable dist-tag readback
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://registry.npmjs.org/planweft?stable_readback=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/planweft-stable-metadata.json"
          python3 - "$RUNNER_TEMP/planweft-stable-metadata.json" "$VERSION" <<'PY'
          import json, sys
          tags = json.load(open(sys.argv[1]))['dist-tags']
          version = sys.argv[2]
          assert tags['latest'] == version, tags
          assert tags['next'] == version, tags
          print(tags)
          PY

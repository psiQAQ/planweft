name: Publish candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'psiQAQ/planweft' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - run: python3 scripts/build-plugin.py --verify
      - run: node tests/installer.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/prepare-native-release.py --release --output "$RUNNER_TEMP/planweft-release" --repository-url https://github.com/psiQAQ/planweft
      - name: Gate and publish to next (never promotes latest)
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          ARCHIVE="$RUNNER_TEMP/planweft-release/npm/planweft-$VERSION.tgz"
          python3 scripts/check-release-gate.py --archive "$ARCHIVE"
          npm publish "$ARCHIVE" --access public --tag next --provenance

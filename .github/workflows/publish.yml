name: Publish candidate
on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: SHA-256 of the exact 0.5 archive admitted by the prepublication gate
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'psiQAQ/planweft' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: npm install --global npm@11.11.0 --ignore-scripts
      - run: python3 scripts/build-plugin.py --verify
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: node tests/installer.test.mjs
      - run: node tests/dsh-hook-shell.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Gate and publish 0.5 to next (never promotes latest)
        env:
          EXPECTED_NPM_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          npm pack --pack-destination "$RUNNER_TEMP" --json
          ARCHIVE="$RUNNER_TEMP/planweft-$VERSION.tgz"
          ACTUAL_NPM_SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          test "$ACTUAL_NPM_SHA256" = "$EXPECTED_NPM_SHA256"
          python3 scripts/check-document-release-gate.py \
            --evidence release/evidence/0.5.0/prepublication.json --archive "$ARCHIVE"
          npm publish "$ARCHIVE" --access public --tag next --provenance

name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node tests/installer.test.mjs
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python3 scripts/build-plugin.py --verify
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/prepare-native-release.py --release --output "$RUNNER_TEMP/planweft-release" --repository-url https://github.com/psiQAQ/planweft

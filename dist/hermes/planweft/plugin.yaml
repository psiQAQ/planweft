name: planweft
version: 0.4.0-rc.1
description: Hermes adapter for persistent project planning and selected context injection. Resolves root and .planning/<slug> plans, injects the attested plan each turn, reminds after writes, and registers /pw-pwf and /pwf-status. Optional gated mode can request continuation only through the Hermes pre_verify hook, bounded by agent.max_verify_nudges; legacy plans stay advisory. Explicit catchup modes read same-project local session records for aggregate counts or bounded replay. No network upload path.
author: planweft contributors
provides_tools:
  - planweft_init
  - planweft_status
  - planweft_check_complete
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - pre_verify
